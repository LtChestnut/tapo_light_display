; Firmware for the knob's SECONDARY chip (ESP32-U4WDH, reached via the CH340 USB-C orientation).
;
; The stock vendor firmware on that chip runs Bluetooth audio all the time and is the
; biggest battery drain on the board. The S3 can't power it down, so this replaces it with
; an image that goes straight into deep sleep with no wake source (~10 uA) until the next
; power cycle, after which it sleeps again within ~100 ms.
;
; Restore the vendor firmware: esptool write_flash 0x0 \
;   "Resources/9-Burn/Burn operation instructions/ESP32烧录/ESP32_1.85KNOB.bin"
; (or your own backup in tools/secondary_sleep/backup/).
;
; ESP-IDF rather than Arduino: U4WDH rev 3.x is single-core, and a dual-core build aborts at
; boot on it. FREERTOS_UNICORE (sdkconfig.defaults) runs on single- and dual-core parts.

[env:secondary_sleep]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32dev
framework = espidf
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
upload_speed = 460800
monitor_speed = 115200
