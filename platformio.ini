; Tapo Light Display — JC3636K518 (ESP32-S3, 360x360 round ST77916 QSPI, CST816S touch, rotary knob)
;
; Mirrors the vendor's Arduino IDE settings (Resources/2-Program Example/Demo_Arduino/*.png):
;   ESP32S3 Dev Module, 240 MHz, QIO flash, 16 MB, OPI PSRAM, USB CDC on boot, Arduino core 3.1.0.
; Stock PlatformIO "espressif32" only ships Arduino 2.x, so this uses the pioarduino fork for core 3.x.

[platformio]
default_envs = jc3636k518

[env:jc3636k518]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Flash / PSRAM ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv   ; 2x 6.25 MB app slots (OTA-capable) + 3.4 MB SPIFFS
board_build.extra_flags = -DBOARD_HAS_PSRAM

; --- Upload / monitor ---
upload_speed = 921600
; See scripts/reset_after_upload.py for why we don't let esptool reset the chip.
board_upload.after_reset = no_reset
extra_scripts = post:scripts/reset_after_upload.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -DCORE_DEBUG_LEVEL=3

; The PlatformIO registry only has stale 2023 builds of the Espressif display libs,
; so pin the upstream git tags. Versions chosen to satisfy each other's `depends=`:
;   ESP32_Display_Panel 1.0.1 -> ESP32_IO_Expander >=1.0,<2 ; esp-lib-utils >=0.1,<0.2
;   ESP32_IO_Expander 1.0.1   -> esp-lib-utils 0.1.x
lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.1
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.0.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.1.2
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^7.2.1
